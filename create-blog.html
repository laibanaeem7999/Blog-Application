<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog | Create Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">My Blog</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="login.html">Logout</a>
        </div>

    </nav>


    <section class="form-section">

        <div class="form-container blog-form">

            <h1 id="blogFormTitle">Create a New Blog</h1>

            <p id="blogFormDescription">
                Write and publish your blog post.
            </p>


            <form id="blogForm">

                <label for="blogTitle">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="blogTitle"
                    placeholder="Enter your blog title"
                    required
                >


                <label for="blogContent">
                    Blog Content
                </label>

                <textarea
                    id="blogContent"
                    rows="10"
                    placeholder="Write your blog here..."
                    required
                ></textarea>


                <button type="submit" id="blogSubmitButton">
                    Publish Blog
                </button>

            </form>


            <p class="form-link">
                <a href="dashboard.html">
                    ← Back to Dashboard
                </a>
            </p>

        </div>

    </section>


    <footer>
        <p>© 2026 My Blog. All Rights Reserved.</p>
    </footer>

<script>
    if (localStorage.getItem("loggedIn") !== "true") {
        alert("Please login first.");
        window.location.href = "login.html";
    }
</script>
    <script src="js/script.js"></script>

</body>

</html>
