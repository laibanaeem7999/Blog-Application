<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog | Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">My Blog</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </nav>

    <!-- Dashboard -->
    <section class="dashboard">

        <div class="dashboard-header">
            <div>
                <h1>My Dashboard</h1>
                <p>Manage your blogs from here.</p>
            </div>

            <a href="create-blog.html" class="btn">
                + Create New Blog
            </a>
        </div>

        <!-- Blog List -->
        <div class="dashboard-blogs">

            <h2>My Blogs</h2>

            <div id="blogList">

                <!-- Example Blog -->
                <article class="blog-card">
                    <h3>My First Blog</h3>

                    <p>
                        Welcome to my first blog post.
                        This is an example blog that will
                        later be replaced by your own blogs.
                    </p>

                    <button>Edit</button>
                    <button>Delete</button>
                </article>

            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 My Blog. All Rights Reserved.</p>
    </footer>
<script>
    if (localStorage.getItem("loggedIn") !== "true") {
        alert("Please login first.");
        window.location.href = "login.html";
    }
</script>
    <script src="js/script.js"></script>

</body>
</html>
